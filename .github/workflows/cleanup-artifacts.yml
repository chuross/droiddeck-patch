name: Delete old artifacts

on:
  workflow_dispatch:

permissions:
  actions: write

jobs:
  delete:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          CUTOFF: "2026-11-11T21:21:42Z"
        run: |
          gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" \
            --jq ".artifacts[] | select(.created_at < env.CUTOFF) | \"\(.id) \(.name) \(.created_at)\"" > old.txt
          echo "delete $(wc -l < old.txt) artifacts"
          while read -r id name created; do
            echo "$id $name $created"
            gh api -X DELETE "repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}"
          done < old.txt
