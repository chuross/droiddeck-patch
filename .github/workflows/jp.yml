name: Validate Japanese support (no APK build)

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jp-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      build: ${{ steps.plan.outputs.build }}
      tag: ${{ steps.plan.outputs.tag }}
      base: ${{ steps.plan.outputs.base }}
      version_code: ${{ steps.plan.outputs.version_code }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Helper and automation tests
        run: python3 -m unittest discover -s tests -v
      - name: Discover latest stable upstream APK release
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          RUN_NUMBER: ${{ github.run_number }}
        run: python3 tools/release_plan.py --event "$EVENT_NAME" --run-number "$RUN_NUMBER"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-plan
          path: |
            release-plan.json
            candidate.lock.json
          retention-days: 2

  validate:
    needs: plan
    if: needs.plan.outputs.build == 'true' || github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-plan
      - name: Prepare candidate source
        run: python3 tools/prepare.py --lock candidate.lock.json
      - name: Validate generated launch scripts
        env:
          DROIDDECK_PATCH_SOURCE: ${{ github.workspace }}/build/DroidDeck
        run: |
          bash -n build/DroidDeck/tools/linuxfs/overlay/usr/local/bin/droiddeck-session
          python3 -m py_compile build/DroidDeck/tools/linuxfs/overlay/usr/local/bin/droiddeck-game-env
          python3 -m unittest discover -s tests -v
          python3 build/DroidDeck/tools/tests/test_game_environment.py
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Compile Android import UI and resources
        working-directory: build/DroidDeck
        run: ./gradlew :app:compileDebugKotlin --console=plain -PskipRust=true


