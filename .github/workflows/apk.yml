name: Build and publish DroidDeck Patch APK

on:
  push:
    branches: [main]
    paths:
      - 'tools/**'
      - 'overlay/proton-logs/**'
      - 'overlay/proton-import/**'
      - 'upstream.lock.json'
      - '.github/workflows/apk.yml'
  workflow_dispatch:
  schedule:
    - cron: '17 0 * * *'

permissions:
  contents: read

concurrency:
  group: jp-release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      DROIDDECK_GITHUB_REPOSITORY: Droid-Deck/DroidDeck
      DROIDDECK_NDK_VERSION: 27.3.13750724
      DROIDDECK_BUILD_IMAGE: droiddeck-local-cross:24.04-v3
    defaults:
      run:
        working-directory: source
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          path: source
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Helper and automation tests
        run: python3 -m unittest discover -s tests -v
      - name: Plan upstream and source updates
        id: plan
        run: >-
          python3 tools/release_plan.py --event "$GITHUB_EVENT_NAME" --run-number "$GITHUB_RUN_NUMBER"
          --release-repository "$GITHUB_REPOSITORY" --manager "$GITHUB_SHA"
      - name: Prepare and validate candidate source
        if: steps.plan.outputs.build == 'true'
        env:
          DROIDDECK_PATCH_SOURCE: ${{ github.workspace }}/source/build/DroidDeck
          JP_VERSION_CODE: ${{ steps.plan.outputs.version_code }}
        run: |
          python3 tools/prepare.py --lock candidate.lock.json --version-code "$JP_VERSION_CODE"
          bash -n build/DroidDeck/tools/linuxfs/overlay/usr/local/bin/droiddeck-session
          python3 -m py_compile build/DroidDeck/tools/linuxfs/overlay/usr/local/bin/droiddeck-game-env
          python3 -m unittest discover -s tests -v
          python3 build/DroidDeck/tools/tests/test_game_environment.py
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        if: steps.plan.outputs.build == 'true'
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        if: steps.plan.outputs.build == 'true'
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        if: steps.plan.outputs.build == 'true'
        with:
          cache-read-only: false
      - uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        if: steps.plan.outputs.build == 'true'
        with:
          path: ~/.cache/droiddeck-build
          key: apk-downloads-${{ runner.os }}-${{ steps.plan.outputs.base }}-${{ github.run_id }}
          restore-keys: |
            apk-downloads-${{ runner.os }}-${{ steps.plan.outputs.base }}-
            apk-downloads-${{ runner.os }}-
      - name: Cache verified PRoot build outputs
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        if: steps.plan.outputs.build == 'true'
        with:
          path: |
            source/build/DroidDeck/app/src/main/jniLibs/arm64-v8a/libproot.so
            source/build/DroidDeck/app/src/main/jniLibs/arm64-v8a/libproot-loader.so
            source/build/DroidDeck/app/src/main/jniLibs/arm64-v8a/.proot-inputs
            source/build/DroidDeck/app/src/main/jniLibs/arm64-v8a/.proot-outputs
          key: apk-proot-v1-${{ runner.os }}-${{ runner.arch }}-${{ env.DROIDDECK_NDK_VERSION }}-${{ hashFiles('source/build/DroidDeck/tools/proot/**') }}
      - name: Android build dependencies
        if: steps.plan.outputs.build == 'true'
        run: |
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "ndk;$DROIDDECK_NDK_VERSION" "cmake;3.22.1"
          sudo apt-get update
          sudo apt-get install -y zstd
      - name: Prepare native cross-compiler image
        if: steps.plan.outputs.build == 'true'
        working-directory: source/build/DroidDeck
        run: |
          # build_local.sh uses the ECR alias for the official Debian i386 compiler base.
          # Preload the same official image from Docker Hub to avoid ECR's anonymous quota.
          docker pull --platform linux/amd64 docker.io/library/debian:bullseye
          docker tag docker.io/library/debian:bullseye public.ecr.aws/docker/library/debian:bullseye
          docker build --platform linux/amd64 -t "$DROIDDECK_BUILD_IMAGE" -f tools/local-cross.Dockerfile .
      - name: Native components and release APK build
        if: steps.plan.outputs.build == 'true'
        working-directory: source/build/DroidDeck
        run: bash tools/build_local.sh
      - name: Android unit tests (including test compilation)
        if: steps.plan.outputs.build == 'true'
        working-directory: source/build/DroidDeck
        run: |
          cat > "$RUNNER_TEMP/droiddeck-tests.gradle" <<'GRADLE'
          allprojects {
              tasks.withType(Test).configureEach {
                  systemProperty 'robolectric.logging', 'stderr'
                  testLogging {
                      events 'started', 'failed', 'skipped'
                      showStandardStreams = true
                      exceptionFormat = 'full'
                  }
              }
          }
          GRADLE
          ./gradlew testDebugUnitTest --console=plain -PskipRust=true -PndkVersion="$DROIDDECK_NDK_VERSION" --init-script "$RUNNER_TEMP/droiddeck-tests.gradle"
      - name: Preserve failed Android test reports
        if: failure() && steps.plan.outputs.build == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-test-reports
          path: |
            source/build/DroidDeck/app/build/reports/tests/
            source/build/DroidDeck/app/build/test-results/
          retention-days: 3
      - name: Prepare APK and local provenance
        if: steps.plan.outputs.build == 'true'
        run: |
          mkdir -p dist
          cp build/DroidDeck/app/build/outputs/apk/release/app-release.apk dist/DroidDeck-Patch.apk
          cp build/DroidDeck/jp-build.json dist/
      - name: Update this repository's Release
        if: steps.plan.outputs.build == 'true'
        run: >-
          python3 tools/publish_release.py --repository "$GITHUB_REPOSITORY"
          --manager "$GITHUB_SHA" --release-repository "$GITHUB_REPOSITORY" --publish-only
      - name: Record tested upstream after publication
        if: steps.plan.outputs.build == 'true'
        run: >-
          python3 tools/publish_release.py --repository "$GITHUB_REPOSITORY"
          --manager "$GITHUB_SHA" --record-only
      - name: Remove temporary build source
        if: always()
        working-directory: ${{ github.workspace }}
        run: rm -rf source



